<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LCFC Hyper-Real Manager v3</title>
    <style>
        :root { --fm-red: #8b0000; --fm-dark: #050505; --fm-panel: #151515; --lcfc-blue: #0053a0; --accent: #fbbf24; }
        body { background: var(--fm-dark); color: #e2e8f0; font-family: 'Pretendard', sans-serif; margin: 0; overflow: hidden; }
        
        /* [Office View] */
        #office-view { display: flex; height: 100vh; }
        #nav-bar { width: 180px; background: #000; border-right: 1px solid #333; padding: 20px; }
        .nav-item { padding: 12px; margin: 5px 0; color: #888; cursor: pointer; border-radius: 4px; font-size: 13px; }
        .nav-item.active { background: var(--fm-red); color: white; }
        
        #main-dashboard { flex-grow: 1; display: flex; flex-direction: column; }
        #top-header { height: 60px; background: var(--fm-red); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-weight: bold; }
        #dashboard-grid { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 20px; padding: 25px; }
        .panel { background: var(--fm-panel); border-radius: 8px; padding: 20px; border-top: 3px solid var(--lcfc-blue); }

        /* [Match View] */
        #match-view { position: fixed; inset: 0; background: #020617; z-index: 9999; display: none; flex-direction: column; }
        #match-scoreboard { height: 80px; background: #0f172a; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #334155; }
        .score-box { display: flex; align-items: center; gap: 30px; font-size: 26px; font-weight: 900; }
        .match-timer { background: #000; padding: 5px 12px; border-radius: 4px; color: var(--accent); font-family: monospace; }

        #match-content { display: flex; flex-grow: 1; }
        #match-stats-panel { width: 260px; background: rgba(15, 23, 42, 0.95); padding: 20px; border-right: 1px solid #334155; }
        .stat-row { display: flex; justify-content: space-between; margin: 12px 0; font-size: 13px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
        
        #player-hud { width: 260px; background: rgba(15, 23, 42, 0.95); padding: 20px; border-left: 1px solid #334155; }
        .stamina-container { width: 100%; height: 8px; background: #334155; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        #hud-stamina-fill { height: 100%; background: #22c55e; transition: width 0.3s; }

        #pitch-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #020617; }
        canvas { background: #14532d; box-shadow: 0 0 50px rgba(0,0,0,0.5); }

        .btn { padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-adv { background: white; color: black; }
    </style>
</head>
<body>

    <div id="office-view">
        <div id="nav-bar">
            <div style="color: var(--lcfc-blue); font-weight: bold; font-size: 20px; margin-bottom: 30px;">LCFC HUB</div>
            <div class="nav-item active">대시보드</div>
            <div class="nav-item">스쿼드</div>
            <div class="nav-item">일정</div>
        </div>
        <div id="main-dashboard">
            <div id="top-header">
                <div id="display-date">2025-07-21</div>
                <button class="btn btn-adv" onclick="advanceDay()">다음 날로 진행</button>
            </div>
            <div id="dashboard-grid">
                <div class="panel"><h3>다음 경기</h3><div id="next-match-card">로딩 중...</div></div>
                <div class="panel"><h3>리그 순위</h3><table id="office-standings" style="width:100%; font-size:12px;"></table></div>
                <div class="panel"><h3>팀 보고서</h3><p>예산: ₩35.49억</p><p>상태: <span style="color:#22c55e">최상</span></p></div>
            </div>
        </div>
    </div>

    <div id="match-view">
        <div id="match-scoreboard">
            <div class="score-box">
                <span id="home-name">LEICESTER</span>
                <span id="match-score">0 : 0</span>
                <span id="away-name">OPPONENT</span>
                <div class="match-timer" id="match-time">00:00</div>
            </div>
        </div>
        <div id="match-content">
            <div id="match-stats-panel">
                <h4 style="color:var(--accent)">MATCH STATS</h4>
                <div class="stat-row"><span>슈팅</span><span id="s-shots">0 / 0</span></div>
                <div class="stat-row"><span>유효슈팅</span><span id="s-shotson">0 / 0</span></div>
                <div class="stat-row"><span>코너킥</span><span id="s-corners">0 / 0</span></div>
                <div class="stat-row"><span>경고/퇴장</span><span id="s-cards">0 / 0</span></div>
            </div>
            <div id="pitch-container"><canvas id="pitch" width="1050" height="680"></canvas></div>
            <div id="player-hud">
                <h4 style="color:var(--accent)">PLAYER HUD</h4>
                <p id="h-name" style="font-weight:bold; font-size:16px;">선수 선택</p>
                <div class="stat-row"><span>실시간 xG</span><span id="h-xg" style="color:var(--accent)">0.000</span></div>
                <div class="stat-row"><span>관성(Mom)</span><span id="h-mom">0.00</span></div>
                <p style="font-size:11px; margin-top:15px;">스태미나</p>
                <div class="stamina-container"><div id="hud-stamina-fill"></div></div>
                <button class="btn" onclick="stopMatch()" style="background:#ef4444; color:white; width:100%; margin-top:30px;">종료</button>
            </div>
        </div>
    </div>

    <script src="engine.js"></script>
</body>
</html>
