<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FC26 Tactical Sim v2 - Professional Edition</title>
    <style>
        :root { --bg: #020617; --card: #1e293b; --accent: #3b82f6; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; overflow: hidden; }
        
        /* [Office UI] */
        #office-screen { display: flex; height: 100vh; }
        #sidebar { width: 320px; background: #0f172a; border-right: 1px solid #334155; padding: 25px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--accent); }
        
        /* [Match UI] - 경기 중 나타나는 레이어 */
        #game-screen { display: none; position: fixed; inset: 0; background: #020617; z-index: 9999; flex-direction: row; }
        #match-ui { width: 300px; background: rgba(15, 23, 42, 0.95); padding: 20px; border-right: 1px solid #334155; }
        #pitch-area { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        canvas { background: #14532d; border: 4px solid #3f6212; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        
        /* 경기 중 실시간 스탯 플로팅 UI */
        .live-stat { position: absolute; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; font-size: 12px; pointer-events: none; border: 1px solid var(--accent); }
        
        button { width: 100%; padding: 12px; cursor: pointer; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="office-screen">
        <div id="sidebar">
            <h2 id="current-date">2025-08-01</h2>
            <div class="stat-card">
                <p style="font-size: 12px; color: #94a3b8;">NEXT MATCH</p>
                <h3 id="next-opp-name">Loading...</h3>
                <button onclick="advanceDay()">다음 날로 이동</button>
            </div>
            <div id="league-mini-table">
                </div>
        </div>
        <div style="flex-grow:1; padding:40px;">
            <h1>Dashboard</h1>
            <p>팀 컨디션 및 일정을 관리하세요.</p>
        </div>
    </div>

    <div id="game-screen">
        <div id="match-ui">
            <h2 id="match-title" style="color:var(--accent);">Leicester vs Arsenal</h2>
            <hr style="border:0; border-top:1px solid #334155; margin:20px 0;">
            
            <div class="stat-card">
                <p>선택된 선수 스탯</p>
                <h4 id="sel-name">-</h4>
                <div style="font-size:13px; color:#94a3b8;">
                    <p>Height/Weight: <span id="sel-phys">-</span></p>
                    <p>Momentum: <span id="sel-mom">-</span></p>
                    <p>Stamina: <span id="sel-stam">-</span></p>
                    <p style="color:#fbbf24; font-weight:bold;">LIVE xG: <span id="sel-xg">0.000</span></p>
                </div>
            </div>
            <button onclick="endMatch()" style="background:#ef4444;">경기 종료</button>
        </div>
        <div id="pitch-area">
            <canvas id="pitch" width="1050" height="680"></canvas>
            </div>
    </div>

    <script src="engine.js"></script>
</body>
</html>
